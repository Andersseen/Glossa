name: Bug report
description: Report a reproducible problem in Glossa.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or a small example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, pnpm, browser, and relevant deployment/runtime details.
    validations:
      required: true
